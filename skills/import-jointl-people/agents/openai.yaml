interface:
  display_name: "Import People into Jointl"
  short_description: "Validate files and prepare bulk Jointl imports"
  default_prompt: "Use $import-jointl-people to validate this file and prepare the appropriate Jointl import."
dependencies:
  tools:
    - type: "mcp"
      value: "jointl"
      description: "Permission-aware Jointl workspace tools"
      transport: "streamable_http"
      url: "https://api.join.tl/mcp"
policy:
  allow_implicit_invocation: true
