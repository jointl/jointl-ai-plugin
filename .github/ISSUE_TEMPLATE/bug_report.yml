name: Bug report
description: Report a reproducible problem when using Jointl from an AI client.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include customer data, credentials, OAuth tokens, or private workspace information. Security vulnerabilities must be reported to support@join.tl.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Claude
        - ChatGPT
        - Codex
        - Connection or OAuth
        - Jointl workflow guidance
        - Public documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence that demonstrates the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the client and version, operating system, and whether reconnecting changed the result.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed customer data, credentials, tokens, private workspace information, and other sensitive content.
          required: true
